<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>traffic signal</title>
    <style>
        .circel {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: red;
            margin: 20px auto;
        }
         .circel1 {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: green;
            margin: 20px auto;
        }
         .circel2 {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: yellow;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div style="border: 2px solid black; width: 50%; height: 500px; margin: auto; background-color: black;">
        <div class="circel"></div>
        <div class="circel1"></div>
        <div class="circel2"></div>
    </div>
    <script>
        let red = document.querySelector(".circel");
        let green = document.querySelector(".circel1");
        let yellow = document.querySelector(".circel2");
        setInterval(() => {
            red.style.backgroundColor = "red";
            green.style.backgroundColor = "gray";
            yellow.style.backgroundColor = "gray";
            setTimeout(() => {
                red.style.backgroundColor = "gray";
                green.style.backgroundColor = "green";
                yellow.style.backgroundColor = "gray";
                setTimeout(() => {
                    red.style.backgroundColor = "gray";
                    green.style.backgroundColor = "gray";
                    yellow.style.backgroundColor = "yellow";
                }, 2000);
            }, 2000);
        }, 6000);
    </script>
</body>
</html>
