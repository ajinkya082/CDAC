<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form </title>
</head>
<body>
    <form name="myform" onsubmit="return check()">
        <label for="">Enter name:</label>
        <input type="text" name="fname" id="fname"> <br> <br>
         <label for="">Enter email:</label>
        <input type="email" name="uemail" id="uemail"> <br> <br>
        <label for="">Enter password:</label> 
        <input type="password" name="pass" id="pass"> <br>

        <label for="">Select your education</label>
        <input type="checkbox" name="edu" value="ssc">SSC
        <input type="checkbox" name="edu" value="hsc">HSC
        <input type="checkbox" name="edu" value="pg">PG
        <input type="checkbox" name="edu" value="ug">UG
        <br>
        <label for="">Select your course</label>
        <select name="course" id="">
            <option value="">select</option>
            <option value="java">Java</option>
            <option value="python">python</option>
            <option value="html">Html</option>
            <option value="javascript">JavaScript</option>
        </select> <br>
        <button type="submit">Submit</button>

        <script src="./formdoc.js"></script>
    </form>
</body>
</html>
