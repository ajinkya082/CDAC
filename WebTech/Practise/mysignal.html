<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mytraffic</title>
    <style>
        .mainclass{
            border: 2px solid black;
            width: 50%;
            height: 500px;
            margin: auto;
            background-color: black;
        }
        #d1{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: gray;
            margin: 20px auto;
        }
        #d2{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: gray;
            margin: 20px auto;
        }
        #d3{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: gray;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div class="mainclass">

        <div id="d1"></div>
        <div id="d2"></div>
        <div id="d3"></div>
    </div>

    <script>
        let red=document.getElementById("d1");
        let yellow=document.getElementById("d2");
        let green=document.getElementById("d3");

        function turnRed(){
            red.style.backgroundColor="red";
            yellow.style.backgroundColor="gray";
            green.style.backgroundColor="gray";

            setTimeout(turnYellow,2000)
        }
        function turnYellow(){
            red.style.backgroundColor= "gray";
            yellow.style.backgroundColor="yellow";
            green.style.backgroundColor="gray";

            setTimeout(turnGreen,2000);
        }
        function turnGreen(){
            red.style.backgroundColor="gray";
            yellow.style.backgroundColor="gray";
            green.style.backgroundColor="green";

            setTimeout(turnRed,2000);
        }
        
        turnRed();
    </script>
</body>
</html>
